# lockstep.cfg -- ld65 config for lockstep.prg.
# Platform ZP $02-$1F, program $0801-$7FFF, core RAM $8000-$82FF, and the fixed blocks
# ../run_pair.py uses: STARTUP (jmp) at $080D, CONFIG at $0810, STATUS at $0830.

MEMORY {
    ZP:       start = $0002, size = $001E, type = rw, file = "";
    LOADADDR: start = $07FF, size = $0002, type = ro, file = %O;
    MAIN:     start = $0801, size = $77FF, type = rw, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    STARTUP:  load = MAIN,     type = rw, start = $080D;
    NETCFG:   load = MAIN,     type = rw, start = $0810;
    NETSTAT:  load = MAIN,     type = rw, start = $0830;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw, optional = yes;
    BSS:      load = MAIN,     type = bss, define = yes;
}
